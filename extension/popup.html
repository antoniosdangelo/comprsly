<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 240px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
    margin: 0;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .stat {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }
  .label {
    font-size: 12px;
    color: #7a7a7a;
    margin: 0 0 16px;
  }
  .note {
    font-size: 11px;
    color: #9a9a9a;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <h1>Token Saver</h1>
  <p class="stat" id="tokens-saved">0</p>
  <p class="label">tokens saved</p>
  <p class="note">Runs fully local. Nothing you type ever leaves your browser.</p>
  <script src="popup.js"></script>
</body>
</html>
