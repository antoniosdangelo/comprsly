<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card {
    width: 1080px;
    height: 1350px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    padding: 90px 90px 70px;
  }

  .eyebrow {
    font-size: 24px;
    font-weight: 600;
    color: #676767;
    margin-bottom: 26px;
  }

  .headline {
    font-size: 52px;
    font-weight: 600;
    color: #121212;
    line-height: 1.15;
    margin-bottom: 50px;
  }

  .panel {
    border: 1px solid #ECECEC;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.10);
    padding: 40px 44px 44px;
  }

  .panel-label {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #5C5C5C;
    margin-bottom: 18px;
  }

  .panel-number {
    font-size: 60px;
    font-weight: 700;
    color: #121212;
    margin-bottom: 44px;
  }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 26px;
    height: 180px;
    margin-bottom: 14px;
  }

  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex: 1;
  }

  .bar {
    width: 100%;
    background: #121212;
    border-radius: 8px 8px 0 0;
  }

  .bar-label {
    font-size: 20px;
    color: #5C5C5C;
  }

  .caption {
    font-size: 21px;
    line-height: 1.5;
    color: #676767;
    margin-top: 30px;
    padding-top: 30px;
    border-top: 1px solid #ECECEC;
  }

  .footer {
    margin-top: auto;
    padding-top: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #676767; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>
    <div class="headline">Every rewrite, counted.</div>

    <div class="panel">
      <div class="panel-label">Tokens saved this week</div>
      <div class="panel-number">18,100</div>

      <div class="chart">
        <div class="bar-col"><div class="bar" style="height:56px"></div><div class="bar-label">M</div></div>
        <div class="bar-col"><div class="bar" style="height:100px"></div><div class="bar-label">T</div></div>
        <div class="bar-col"><div class="bar" style="height:36px"></div><div class="bar-label">W</div></div>
        <div class="bar-col"><div class="bar" style="height:120px"></div><div class="bar-label">T</div></div>
        <div class="bar-col"><div class="bar" style="height:78px"></div><div class="bar-label">F</div></div>
        <div class="bar-col"><div class="bar" style="height:150px"></div><div class="bar-label">S</div></div>
        <div class="bar-col"><div class="bar" style="height:104px"></div><div class="bar-label">S</div></div>
      </div>

      <div class="caption">Comprsly keeps a running count on your device, storing up to the last 7 days of token savings so you can see what the trimming is actually worth.</div>
    </div>

    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
