<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card { width: 1080px; height: 1350px; background: #FFFFFF; display: flex; flex-direction: column; padding: 90px 90px 70px; }

  .eyebrow { font-size: 24px; font-weight: 600; color: #6A6A6A; margin-bottom: 26px; }
  .headline { font-size: 52px; font-weight: 600; color: #121212; line-height: 1.15; margin-bottom: 24px; }
  .sub { font-size: 24px; color: #6A6A6A; line-height: 1.5; max-width: 780px; margin-bottom: 56px; }

  .content-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .pills { display: flex; flex-wrap: wrap; gap: 18px; }

  .pill {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid #ECECEC;
    border-radius: 100px;
    padding: 18px 30px;
  }

  .pill img { width: 30px; height: 30px; }
  .pill span { font-size: 26px; color: #121212; font-weight: 500; }

  .footer { margin-top: auto; padding-top: 40px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #6A6A6A; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>

    <div class="content-wrap">
      <div class="headline">Works where you already chat.</div>
      <div class="sub">Comprsly recognizes supported AI chats and stays out of the way everywhere else.</div>

      <div class="pills">
        <div class="pill"><img src="../materials/icons/openai-mono.png" alt=""><span>ChatGPT</span></div>
        <div class="pill"><img src="../materials/icons/claude-mono.png" alt=""><span>Claude</span></div>
        <div class="pill"><img src="../materials/icons/gemini-mono.png" alt=""><span>Gemini</span></div>
        <div class="pill"><img src="../materials/icons/copilot-mono.png" alt=""><span>Copilot</span></div>
        <div class="pill"><img src="../materials/icons/grok-mono.png" alt=""><span>Grok</span></div>
        <div class="pill"><img src="../materials/icons/deepseek-mono.png" alt=""><span>DeepSeek</span></div>
        <div class="pill"><img src="../materials/icons/perplexity-mono.png" alt=""><span>Perplexity</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
