<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card { width: 1080px; height: 1350px; background: #FFFFFF; display: flex; flex-direction: column; padding: 90px 90px 70px; }

  .eyebrow { font-size: 24px; font-weight: 600; color: #6A6A6A; margin-bottom: 26px; }

  .quote-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .quote { font-size: 74px; font-weight: 600; color: #121212; line-height: 1.2; margin-bottom: 40px; }

  .list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 36px; }

  .list-item { display: flex; align-items: center; gap: 16px; font-size: 28px; color: #121212; }
  .list-item .x { color: #121212; font-weight: 700; font-size: 26px; }

  .sub { font-size: 26px; color: #6A6A6A; line-height: 1.5; max-width: 800px; }

  .footer { margin-top: auto; padding-top: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #6A6A6A; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>

    <div class="quote-wrap">
      <div class="quote">Free because there's nothing to keep alive.</div>
      <div class="list">
        <div class="list-item"><span class="x">&#10003;</span> No trial</div>
        <div class="list-item"><span class="x">&#10003;</span> No nag screens</div>
        <div class="list-item"><span class="x">&#10003;</span> No "upgrade to unlock"</div>
      </div>
      <div class="sub">Nothing about running this costs money once you've downloaded it. Free isn't a phase, it's just how it's built.</div>
    </div>

    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
