<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card {
    width: 1080px;
    height: 1350px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    padding: 90px 90px 70px;
  }

  .eyebrow {
    font-size: 24px;
    font-weight: 600;
    color: #676767;
    margin-bottom: 26px;
  }

  .quote-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .quote {
    font-size: 84px;
    font-weight: 600;
    color: #121212;
    line-height: 1.18;
    margin-bottom: 40px;
  }

  .sub {
    font-size: 28px;
    color: #676767;
    line-height: 1.5;
    max-width: 820px;
  }

  .footer {
    margin-top: auto;
    padding-top: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #676767; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>

    <div class="quote-wrap">
      <div class="quote">You don't need a cheaper model.<br>You need a shorter prompt.</div>
      <div class="sub">Same model, same answer, way less rambling on the way in. Cutting the filler doesn't cost you anything to do.</div>
    </div>

    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
