<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card { width: 1080px; height: 1350px; background: #FFFFFF; display: flex; flex-direction: column; padding: 90px 90px 70px; }

  .eyebrow { font-size: 24px; font-weight: 600; color: #6A6A6A; margin-bottom: 26px; }

  .q-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .q-label { font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #9A9A9A; margin-bottom: 16px; }
  .q { font-size: 46px; font-weight: 600; color: #121212; line-height: 1.25; margin-bottom: 44px; }

  .a-label { font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #9A9A9A; margin-bottom: 16px; }
  .a { font-size: 30px; color: #121212; line-height: 1.5; }

  .footer { margin-top: auto; padding-top: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #6A6A6A; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>

    <div class="q-wrap">
      <div class="q-label">Question</div>
      <div class="q">Does Comprsly send my prompts anywhere?</div>
      <div class="a-label">Answer</div>
      <div class="a">No. Nothing you type is ever sent anywhere. The only network use, ever, is downloading the app itself.</div>
    </div>

    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
