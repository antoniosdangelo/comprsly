<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card { width: 1080px; height: 1350px; background: #FFFFFF; display: flex; flex-direction: column; padding: 90px 90px 70px; }

  .eyebrow { font-size: 24px; font-weight: 600; color: #676767; margin-bottom: 26px; }
  .headline { font-size: 52px; font-weight: 600; color: #121212; line-height: 1.15; margin-bottom: 56px; }

  .content-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .specs { border: 1px solid #ECECEC; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.10); overflow: hidden; margin-bottom: 40px; }

  .spec-row { display: flex; justify-content: space-between; align-items: center; padding: 28px 34px; border-bottom: 1px solid #ECECEC; }
  .spec-row:last-child { border-bottom: none; }

  .spec-label { font-size: 24px; color: #676767; }
  .spec-value { font-size: 24px; color: #121212; font-weight: 600; }

  .sub { font-size: 22px; color: #676767; line-height: 1.5; max-width: 800px; }

  .footer { margin-top: auto; padding-top: 40px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #676767; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>

    <div class="content-wrap">
      <div class="headline">Here's exactly what you're installing.</div>

      <div class="specs">
        <div class="spec-row"><div class="spec-label">Price</div><div class="spec-value">Free</div></div>
        <div class="spec-row"><div class="spec-label">Platform</div><div class="spec-value">Windows 10 and 11</div></div>
        <div class="spec-row"><div class="spec-label">Download</div><div class="spec-value">~1 GB, everything included</div></div>
        <div class="spec-row"><div class="spec-label">Account</div><div class="spec-value">None required</div></div>
        <div class="spec-row"><div class="spec-label">Tracking</div><div class="spec-value">None</div></div>
      </div>

      <div class="sub">One download. No separate model step, no second install, no account to create first.</div>
    </div>

    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
