<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #card { width: 1080px; height: 1350px; background: transparent; position: relative; }

  .eyebrow { position: absolute; top: 90px; left: 90px; font-size: 24px; font-weight: 600; color: #6A6A6A; }

  .footer { position: absolute; top: 817px; left: 90px; right: 90px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 52px; width: auto; display: block; }
  .handle { font-size: 26px; color: #6A6A6A; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">@comprsly</div>
    <div class="footer">
      <div class="brand">
        <img src="../materials/icons/mark_dark.png" alt="Comprsly">
      </div>
      <div class="handle">@comprsly</div>
    </div>
  </div>
</body>
</html>
