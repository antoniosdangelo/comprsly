name: Build

# Safety: only ever runs on pushes/tags YOU make, or a manual click.
# Deliberately no `pull_request` / `pull_request_target` trigger — a public
# repo means anyone can open a PR, and either of those triggers would let a
# stranger's fork run code in this workflow with access to repo secrets
# (eventually the SignPath signing token). Build-and-test-only workflows for
# external PRs, if ever added, must live in a separate workflow file with no
# secrets access.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

# Least-privilege default token. Nothing in this workflow needs write access
# to the repo itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Comprsly.exe (PyInstaller)
        run: pyinstaller Comprsly.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      # --- Code signing goes here once the Azure Trusted Signing resource
      # exists. Left out on purpose rather than stubbed with a fake secret,
      # nothing here should reference a token that doesn't exist yet.
      #
      # - name: Sign installer (Azure Trusted Signing)
      #   shell: pwsh
      #   run: |
      #     dotnet tool install --global sign
      #     sign code trusted-signing `
      #       "installer-output/ComprslySetup.exe" `
      #       --trusted-signing-account "<account-name>" `
      #       --certificate-profile "<profile-name>" `
      #       --azure-key-vault-tenant-id "<tenant-id>" `
      #       --azure-key-vault-client-id "<client-id>" `
      #       --azure-key-vault-client-secret "${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}"

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comprsly-build-${{ github.sha }}
          path: |
            dist/
            installer-output/ComprslySetup.exe
          retention-days: 14
