name: macOS
# Builds and tests the Mac app on every push.
#
# This exists because the macOS layer was written on a Windows machine against
# Apple's documented API and has never run on real hardware. A macos-latest
# runner is the only honest check available without buying a Mac: it proves the
# code imports with real pyobjc, that the shared logic passes, and that the
# .app builds.
#
# It does NOT prove the Accessibility API behaves. That API returns nothing at
# all until a human ticks Accessibility in System Settings, and a CI runner has
# no one to tick it. Anything touching AXUIElement or CGEventTap stays
# unverified until Antonio runs it himself.
#
# macos-latest is free for public repositories.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [sandbox, main]
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Mac dependencies
        working-directory: product/build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
      - name: The shared engine and the Mac layer
        run: python -m unittest discover -s product/backend -p "test_*.py" -v
      - name: pyobjc is really present, so the fail closed paths are not what passed
        working-directory: product/backend
        run: |
          python -c "
          import platform_mac
          assert platform_mac.available(), 'pyobjc did not import on a real Mac'
          from platform_mac import accessibility, input, processes, paths
          print('accessibility permission (expected False on CI):', accessibility.permission_granted())
          table = processes.process_table()
          assert table, 'ps returned nothing on a real Mac'
          print('ps saw', len(table), 'processes')
          print('support dir:', paths.support_dir())
          "

  build:
    runs-on: macos-latest
    needs: test
    # The signing gate lives here, not in the steps below, because a step
    # `if` can read the env context but NOT the secrets context. Referencing
    # secrets in an `if` is a workflow validation error, which GitHub reports
    # by failing the whole run in 0s with no jobs and no log.
    env:
      DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: product/build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install pyinstaller
      - name: Make the .icns from the shared png
        # iconutil is macOS only, so the icon cannot be committed from Windows.
        working-directory: product/frontend/assets
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          ls -la icon.icns
      - name: Build Comprsly.app
        working-directory: product/build
        run: pyinstaller Comprsly-mac.spec --noconfirm --clean
      - name: It is a real bundle and it launches far enough to be worth shipping
        working-directory: product/build
        run: |
          test -d dist/Comprsly.app || { echo "no .app produced"; exit 1; }
          test -f dist/Comprsly.app/Contents/MacOS/Comprsly || { echo "no executable inside"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/Comprsly.app/Contents/Info.plist

      # ---- Signing and notarisation: written, switched OFF ----
      # Everything below runs only once APPLE_DEVELOPER_ID exists as a secret,
      # which needs the $99/year Apple Developer account. Until then the steps
      # skip themselves rather than failing, so this workflow stays green.
      #
      # Without this, a downloaded .app is unsigned: macOS Gatekeeper refuses
      # to open it and the user has to right click, Open, and confirm. That is
      # a real install step to document, not a bug.
      - name: Sign the app
        if: env.DEVELOPER_ID != ''
        working-directory: product/build
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements Comprsly.entitlements \
            --sign "$DEVELOPER_ID" dist/Comprsly.app
          codesign --verify --deep --strict --verbose=2 dist/Comprsly.app
      - name: Notarise and staple
        if: env.DEVELOPER_ID != ''
        working-directory: product/build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Comprsly.app Comprsly.zip
          xcrun notarytool submit Comprsly.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Comprsly.app
      # upload-artifact zips what it is handed and preserves neither the
      # executable bit nor the symlinks inside Comprsly.app, so a downloaded
      # bundle will not launch. tar keeps both, and the smoke job below needs
      # this one to actually run.
      - name: Pack the .app
        working-directory: product/build
        run: tar -czf Comprsly-mac.tar.gz -C dist Comprsly.app
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Comprsly-mac
          path: product/build/Comprsly-mac.tar.gz
          if-no-files-found: error

  # Antonio wants to see the Mac app behave before paying to rent a Mac. This
  # drives the built .app on the only Mac available: it opens TextEdit, types
  # a sentence with three mistakes in it through the product's own input path,
  # lets the app draw the REAL badge on that text box, measures the badge in a
  # screenshot, and then has the app correct the sentence in place.
  #
  # The verdicts are in product/tools/mac_smoke.py, and every one of them is a
  # measurement rather than something the app said about itself. A BLOCKED or
  # FAILED verdict fails this job: the runner grants both Accessibility and
  # Screen Recording, so there is nothing here that should legitimately be
  # refused, and a run that goes quiet is the thing worth catching.
  #
  # THREE TIMES, because the thing being proven is that the Mac app behaves,
  # and a UI driven across process boundaries fails intermittently or not at
  # all. One green run proves less than three. fail-fast is off so a flaky
  # attempt does not hide the other two, and each uploads its own report.
  #
  # Runs on pull requests too, which is what Antonio asked for: the point is
  # to see the Mac behave before a branch is merged, and a skipped job shows
  # him nothing. It also runs on workflow_dispatch, so it can be started by
  # hand from the Actions tab without pushing anything.
  smoke:
    runs-on: macos-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Mac dependencies
        working-directory: product/build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
      - uses: actions/download-artifact@v4
        with:
          name: Comprsly-mac
          path: product/build
      - name: Unpack the .app
        working-directory: product/build
        run: |
          mkdir -p dist
          tar -xzf Comprsly-mac.tar.gz -C dist
          ls -la dist/Comprsly.app/Contents/MacOS
      - name: Drive it, measure it, write down what happened
        working-directory: product/tools
        # Exits non-zero on any BLOCKED or FAILED verdict, so this step is the
        # loud failure. The report still gets uploaded by the step below.
        run: python mac_smoke.py --app ../build/dist/Comprsly.app --out "$RUNNER_TEMP/smoke"
      # if: always(), because the most informative run is the one that went
      # wrong, and the report is the only record of why.
      - name: Keep the report and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-${{ matrix.attempt }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error
      - name: Say what it concluded, in the job summary
        if: always()
        run: |
          echo "## macOS smoke, attempt ${{ matrix.attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # The verdict table is everything above the first section rule.
          sed -n '1,/^===/p' "$RUNNER_TEMP/smoke/smoke-report.txt"             | sed '$d' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
