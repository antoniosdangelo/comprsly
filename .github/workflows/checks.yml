name: Checks
# Every pull request and every push to sandbox: the tests run, the app
# compiles, no secrets.
#
# The tests used to run only in deploy.yml, on a push to main, so a failing
# test could never stop a merge, and the desktop tests ran nowhere at all.
# They run here now.
#
# This repo is product only since 2026-11-26. The site and its Worker live in
# the private comprsly-website repo, which carries its own checks and its own
# deploy, so there is nothing Node or Cloudflare shaped left here.
on:
  pull_request:
  push:
    branches: [sandbox]
permissions:
  contents: read
  pull-requests: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: App compiles
        run: python -m py_compile product/backend/*.py product/tools/*.py

  # On Windows deliberately: main.py does `from ctypes import wintypes` at
  # import time, which does not exist on Linux, so these cannot run on the
  # ubuntu runner however they are invoked.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/build/requirements.txt
      # The same list the build job installs, rather than a second shorter one
      # that would drift out of sync with it.
      - name: Install dependencies
        working-directory: product/build
        run: pip install -r requirements.txt
      - name: Desktop tests
        run: python -m unittest discover -s product/backend -p "test_*.py" -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
